name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting, lint, strict types, unit, contract, integration, provisioning, boundary and
      # container-policy tests, the production build, and Compose validation.
      - run: pnpm check
      # Browser end-to-end coverage against the built application and a provisioned snapshot.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Image build, runtime image inspection, and the offline runtime smoke test.
      - run: pnpm compose:build
      - run: pnpm images:inspect
      - run: pnpm test:offline
