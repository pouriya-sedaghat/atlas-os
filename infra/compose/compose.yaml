name: atlas-os

services:
  api:
    image: atlas-os/api:m0
    build:
      context: ../..
      dockerfile: infra/images/server.Dockerfile
      target: api-runtime
    environment:
      ATLAS_ACTIVE_SNAPSHOT_PATH: /var/lib/atlas/active.json
      ATLAS_API_HOST: 0.0.0.0
      ATLAS_API_PORT: '3000'
      ATLAS_DATA_ROOT: /var/lib/atlas
      ATLAS_GATEWAY_ORIGIN: http://127.0.0.1:8080
      ATLAS_LOG_LEVEL: info
      ATLAS_OFFLINE: 'true'
      ATLAS_PROFILE: default
      ATLAS_REGION: iran
      ATLAS_SEARCH_ENGINE_BLUE_URL: http://search-blue:2322
      ATLAS_SEARCH_ENGINE_GREEN_URL: http://search-green:2322
      ATLAS_UPDATE_MODE: disabled
    # The active dataset is mounted read-only: the request-serving process can read snapshot
    # resources but cannot modify, replace or delete them. Provisioning happens outside this
    # container, so no tile-generation tooling is present in the serving image.
    volumes:
      - ${ATLAS_DATA_ROOT:-../../data}:/var/lib/atlas:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s

  # One private search host per slot, each in its own container and network namespace. The
  # engine inside listens on loopback only; the host answers on the internal runtime network and
  # publishes no port. The slots are mounted read-only; the engine's disposable working copy lives
  # only in the host's own named volume.
  search-blue:
    image: atlas-os/search:m2
    build:
      context: ../..
      dockerfile: infra/images/search.Dockerfile
      target: search-runtime
    environment:
      ATLAS_DATA_ROOT: /var/lib/atlas
      ATLAS_OFFLINE: 'true'
      ATLAS_REGION: iran
      ATLAS_SEARCH_ENGINE_HEAP: ${ATLAS_SEARCH_ENGINE_HEAP:-1g}
      ATLAS_SEARCH_SLOT: blue
    volumes:
      - ${ATLAS_DATA_ROOT:-../../data}:/var/lib/atlas:ro
      - search-blue-work:/var/lib/atlas-engine
    # Hard limits for the whole container: the host, the engine's heap and everything beyond it.
    # They bound the container; they are not a size for any region. Set them from a measured run.
    mem_limit: ${ATLAS_SEARCH_HOST_MEMORY_LIMIT:-2g}
    memswap_limit: ${ATLAS_SEARCH_HOST_MEMORY_LIMIT:-2g}
    pids_limit: ${ATLAS_SEARCH_HOST_PIDS_LIMIT:-1024}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:2322/v1/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s

  search-green:
    image: atlas-os/search:m2
    build:
      context: ../..
      dockerfile: infra/images/search.Dockerfile
      target: search-runtime
    environment:
      ATLAS_DATA_ROOT: /var/lib/atlas
      ATLAS_OFFLINE: 'true'
      ATLAS_REGION: iran
      ATLAS_SEARCH_ENGINE_HEAP: ${ATLAS_SEARCH_ENGINE_HEAP:-1g}
      ATLAS_SEARCH_SLOT: green
    volumes:
      - ${ATLAS_DATA_ROOT:-../../data}:/var/lib/atlas:ro
      - search-green-work:/var/lib/atlas-engine
    # Hard limits for the whole container: the host, the engine's heap and everything beyond it.
    # They bound the container; they are not a size for any region. Set them from a measured run.
    mem_limit: ${ATLAS_SEARCH_HOST_MEMORY_LIMIT:-2g}
    memswap_limit: ${ATLAS_SEARCH_HOST_MEMORY_LIMIT:-2g}
    pids_limit: ${ATLAS_SEARCH_HOST_PIDS_LIMIT:-1024}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:2322/v1/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s

  updater:
    image: atlas-os/updater:m0
    build:
      context: ../..
      dockerfile: infra/images/server.Dockerfile
      target: updater-runtime
    environment:
      ATLAS_ACTIVE_SNAPSHOT_PATH: /var/lib/atlas/active.json
      ATLAS_DATA_ROOT: /var/lib/atlas
      ATLAS_OFFLINE: 'true'
      ATLAS_PROFILE: default
      ATLAS_REGION: iran
      ATLAS_UPDATE_MODE: disabled
      ATLAS_UPDATER_HOST: 0.0.0.0
      ATLAS_UPDATER_PORT: '3001'
    volumes:
      - ${ATLAS_DATA_ROOT:-../../data}:/var/lib/atlas:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 15s

  web:
    image: atlas-os/web:m0
    build:
      context: ../..
      dockerfile: infra/images/web.Dockerfile
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [runtime]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 10s

  gateway:
    image: nginxinc/nginx-unprivileged:1.27.5-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:${ATLAS_GATEWAY_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - edge
      - runtime
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 10s

networks:
  runtime:
    internal: true
    driver: bridge
  edge:
    driver: bridge

volumes:
  search-blue-work:
  search-green-work:
